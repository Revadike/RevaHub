services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: revahub
      POSTGRES_PASSWORD: revahub
      POSTGRES_DB: revahub
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revahub"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_dev_data:
